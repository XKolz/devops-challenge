site_name: DevOps Challenge — Docs
site_description: Local guide for the FastAPI + AWS DevOps challenge submission

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Local Development: local-dev.md
  - Deployment: deployment.md
  - Infrastructure: infrastructure.md
  - CI/CD Pipeline: cicd.md
  - API Reference: api.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
